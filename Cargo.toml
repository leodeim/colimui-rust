[package]
name = "colimuir"
version = "0.0.0"
edition = "2024"
rust-version = "1.90"
description = "A lightweight terminal UI for Colima and Docker"
license = "MIT"
publish = false

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std"] }
crossterm = "0.29"
hex = "0.4"
libc = "0.2"
memchr = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
signal-hook = "0.3"
tempfile = "3"
thiserror = "2"
unicode-width = "0.2"
ureq = "3"

[target.'cfg(target_os = "macos")'.dependencies]
png = "0.18"
tao = "0.37"
tray-icon = "0.26"

[dev-dependencies]
png = "0.18"

[profile.release]
strip = true
